<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a2a4a"/>
      <stop offset="0.6" stop-color="#1c1426"/>
      <stop offset="1" stop-color="#0b0810"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.25" stop-color="#d9a640"/>
      <stop offset="0.5" stop-color="#8a5a18"/>
      <stop offset="0.75" stop-color="#d9a640"/>
      <stop offset="1" stop-color="#6b4210"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c47a3c"/>
      <stop offset="0.5" stop-color="#8e4f22"/>
      <stop offset="1" stop-color="#4e2810"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d88b48"/>
      <stop offset="1" stop-color="#8a4a1e"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8622c"/>
      <stop offset="1" stop-color="#5a2e12"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb06a"/>
      <stop offset="0.5" stop-color="#5f7034"/>
      <stop offset="1" stop-color="#2f3a18"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e1f0b"/>
      <stop offset="0.5" stop-color="#6e3a17"/>
      <stop offset="1" stop-color="#3e1f0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#e3b148"/>
      <stop offset="1" stop-color="#7a4c10"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- icon well -->
  <rect x="0" y="0" width="512" height="512" fill="url(#frame)"/>
  <rect x="14" y="14" width="484" height="484" fill="#2a1a08"/>
  <rect x="22" y="22" width="468" height="468" fill="url(#bg)"/>
  <!-- glow behind pack -->
  <circle cx="256" cy="270" r="190" fill="#e3b148" opacity="0.10"/>

  <!-- shadow -->
  <ellipse cx="256" cy="458" rx="160" ry="16" fill="#000" opacity="0.5"/>

  <!-- top carry loop -->
  <path d="M214 122 C 214 70, 298 70, 298 122" fill="none" stroke="#2e1606" stroke-width="26" stroke-linecap="round"/>
  <path d="M214 122 C 214 70, 298 70, 298 122" fill="none" stroke="url(#strap)" stroke-width="16" stroke-linecap="round"/>

  <!-- side pockets (behind body) -->
  <path d="M96 268 Q 78 272 80 306 L 86 404 Q 90 432 120 430 L 136 428 L 132 268 Z" fill="url(#pocket)" stroke="#2e1606" stroke-width="6" stroke-linejoin="round"/>
  <path d="M416 268 Q 434 272 432 306 L 426 404 Q 422 432 392 430 L 376 428 L 380 268 Z" fill="url(#pocket)" stroke="#2e1606" stroke-width="6" stroke-linejoin="round"/>
  <path d="M84 318 L 132 316" stroke="#2e1606" stroke-width="5"/>
  <path d="M428 318 L 380 316" stroke="#2e1606" stroke-width="5"/>

  <!-- main body -->
  <path d="M128 168 Q 128 132 166 128 L 346 128 Q 384 132 384 168 L 392 412 Q 392 446 356 446 L 156 446 Q 120 446 120 412 Z"
        fill="url(#leather)" stroke="#2e1606" stroke-width="7" stroke-linejoin="round"/>
  <!-- body stitching -->
  <path d="M146 176 Q 146 148 172 146 L 340 146 Q 366 148 366 176 L 372 408 Q 372 428 352 428 L 160 428 Q 140 428 140 408 Z"
        fill="none" stroke="#f2c48c" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- leather creases -->
  <path d="M150 300 Q 170 296 178 312" fill="none" stroke="#3a1c08" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <path d="M362 380 Q 344 376 336 392" fill="none" stroke="#3a1c08" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  <!-- left-edge highlight -->
  <path d="M138 180 L 132 400" stroke="#ffd2a0" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>

  <!-- front pocket -->
  <path d="M176 330 L 336 330 Q 350 330 350 346 L 346 410 Q 344 426 328 426 L 184 426 Q 168 426 166 410 L 162 346 Q 162 330 176 330 Z"
        fill="url(#pocket)" stroke="#2e1606" stroke-width="6" stroke-linejoin="round"/>
  <path d="M180 342 L 332 342" stroke="#f2c48c" stroke-opacity="0.4" stroke-width="3" stroke-dasharray="9 7"/>

  <!-- flap -->
  <path d="M120 164 Q 120 124 164 122 L 348 122 Q 392 124 392 164 L 392 236 Q 392 262 362 270 L 290 292 Q 256 302 222 292 L 150 270 Q 120 262 120 236 Z"
        fill="url(#flap)" stroke="#2e1606" stroke-width="7" stroke-linejoin="round"/>
  <path d="M138 166 Q 138 140 166 140 L 346 140 Q 374 140 374 166 L 374 232 Q 374 250 352 256 L 286 276 Q 256 284 226 276 L 160 256 Q 138 250 138 232 Z"
        fill="none" stroke="#ffe0b0" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M164 132 L 348 132" stroke="#ffe6c2" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>

  <!-- bedroll on top -->
  <rect x="104" y="86" width="304" height="62" rx="31" fill="url(#roll)" stroke="#1e2610" stroke-width="6"/>
  <ellipse cx="406" cy="117" rx="18" ry="31" fill="#4d5a28" stroke="#1e2610" stroke-width="6"/>
  <path d="M406 98 Q 396 117 406 136" fill="none" stroke="#2a3314" stroke-width="4"/>
  <path d="M120 98 L 392 98" stroke="#d4e0a0" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <!-- bedroll ties -->
  <rect x="160" y="80" width="22" height="74" rx="5" fill="url(#strap)" stroke="#2e1606" stroke-width="4"/>
  <rect x="330" y="80" width="22" height="74" rx="5" fill="url(#strap)" stroke="#2e1606" stroke-width="4"/>

  <!-- flap straps down to buckles -->
  <rect x="180" y="224" width="30" height="120" rx="5" fill="url(#strap)" stroke="#2e1606" stroke-width="4"/>
  <rect x="302" y="224" width="30" height="120" rx="5" fill="url(#strap)" stroke="#2e1606" stroke-width="4"/>
  <!-- buckles -->
  <rect x="170" y="290" width="50" height="40" rx="7" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <rect x="292" y="290" width="50" height="40" rx="7" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <line x1="195" y1="293" x2="195" y2="327" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <line x1="317" y1="293" x2="317" y2="327" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- center clasp gem on flap -->
  <path d="M256 250 L 278 272 L 256 294 L 234 272 Z" fill="url(#gold)" stroke="#5a3608" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256 260 L 268 272 L 256 284 L 244 272 Z" fill="#3fa7c9" stroke="#0f3f52" stroke-width="3"/>
  <path d="M250 266 L 256 260 L 260 264" fill="none" stroke="#c8f2ff" stroke-width="3" stroke-linecap="round"/>

  <!-- vignette + inner bevel -->
  <rect x="22" y="22" width="468" height="468" fill="url(#vignette)"/>
  <rect x="22" y="22" width="468" height="468" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="6"/>
  <path d="M14 14 L 498 14 M14 14 L 14 498" stroke="#fff6cc" stroke-opacity="0.5" stroke-width="3"/>
</svg>
